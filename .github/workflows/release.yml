name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: .\installer\Build-Installer.ps1

      - name: Sign installer
        shell: powershell
        env:
          AIHELPER_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          AIHELPER_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AIHELPER_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:AIHELPER_SIGNING_PFX_PASSWORD)) {
            throw "Release signing secrets are required. Configure WINDOWS_SIGNING_PFX_BASE64 and WINDOWS_SIGNING_PFX_PASSWORD."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "aihelper-release-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:AIHELPER_SIGNING_PFX_BASE64))

            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Recurse `
              -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if ($null -eq $signTool) {
              throw "signtool.exe was not found on the release runner."
            }

            & $signTool.FullName sign `
              /f $certificatePath `
              /p $env:AIHELPER_SIGNING_PFX_PASSWORD `
              /fd SHA256 `
              /tr http://timestamp.digicert.com `
              /td SHA256 `
              .\dist\AIHelper-Setup.exe

            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode signing failed with exit code $LASTEXITCODE."
            }

            # The release certificate may be self-signed, so its chain has no public
            # trust anchor. Import its public part into the ephemeral runner's trust
            # stores so the strict signature verification step can validate the chain
            # against exactly this certificate. The runner is discarded after the job.
            $releaseCertificate = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
              $certificatePath,
              $env:AIHELPER_SIGNING_PFX_PASSWORD)
            $publicCertificate = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
              ,$releaseCertificate.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))

            foreach ($storeName in @('Root', 'TrustedPublisher')) {
              $store = New-Object System.Security.Cryptography.X509Certificates.X509Store($storeName, 'LocalMachine')
              $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              $store.Add($publicCertificate)
              $store.Close()
            }
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify installer signature
        shell: powershell
        run: |
          $signature = Get-AuthenticodeSignature .\dist\AIHelper-Setup.exe
          if ($signature.Status -ne 'Valid') {
            throw "Installer signature is not valid: $($signature.Status) $($signature.StatusMessage)"
          }
          "Signed by: $($signature.SignerCertificate.Subject)"

      - name: Generate installer checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash .\dist\AIHelper-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *AIHelper-Setup.exe" | Set-Content .\dist\SHA256SUMS.txt -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIHelper-Setup
          path: |
            .\dist\AIHelper-Setup.exe
            .\dist\SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .\dist\AIHelper-Setup.exe
            .\dist\SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
